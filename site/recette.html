<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recette — Yumnote</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="recette">

  <div class="app">
    <main id="contenu">
      <noscript><p class="vide">Yumnote a besoin de JavaScript pour afficher les recettes.</p></noscript>

      <div class="detail-hero" id="hero">
        <div class="detail-hero__img" id="visuel" role="img" aria-label="Illustration de la recette">
          <span id="visuel-emoji" aria-hidden="true"></span>
        </div>
        <a class="ob ob--left" href="index.html" data-back aria-label="Retour"><span data-icon="arrow-left"></span></a>
        <button class="ob ob--right" id="fav" type="button" aria-pressed="false" aria-label="Ajouter aux favoris"><span data-icon="bookmark"></span></button>
      </div>

      <div class="detail-corps" id="detail"></div>
      <p class="sr-only" id="statut" role="status"></p>
    </main>

    <nav class="nv" aria-label="Navigation principale">
      <a href="profil.html"><span data-icon="user"></span>Profil</a>
      <a href="index.html" aria-current="page"><span data-icon="home"></span>Accueil</a>
      <a href="recherche.html?favoris=1" id="nav-carnet"><span data-icon="book"></span>Carnet</a>
